<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
    <style>
      .box{fill:#fff;stroke:#33475b;stroke-width:1.3}
      .t{fill:#1c2430;text-anchor:middle}
      .tb{font-weight:600}
      .sm{font-size:10.5px;fill:#4a5a6e}
      .ln{fill:none;stroke:#33475b;stroke-width:1.4;marker-end:url(#ah)}
      .lbl{font-size:10.5px;fill:#1c2430;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
      .zone{font-size:10.5px;font-weight:700;letter-spacing:.06em}
    </style>
  </defs>
  <rect width="1000" height="490" fill="#fff"/>

  <!-- zones -->
  <rect x="175" y="70" width="630" height="405" rx="10" fill="#eef8f1" stroke="#2d8a57" stroke-width="1.6"/>
  <text x="187" y="87" class="zone" fill="#2d8a57">MERIDIAN BANK — EU INFRASTRUCTURE &amp; TENANCY</text>
  <rect x="195" y="100" width="380" height="250" rx="10" fill="#eef4fb" stroke="#2f6db3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="207" y="117" class="zone" fill="#2f6db3">ASSISTANT DATA PLANE</text>
  <text x="207" y="131" class="sm">Zingly software · operated in Meridian's EU cloud tenancy</text>
  <rect x="815" y="265" width="175" height="95" rx="10" fill="#f4f0fb" stroke="#6b4bb3" stroke-width="1.5"/>
  <text x="827" y="281" class="zone" fill="#6b4bb3">SALESFORCE FSC (CRM)</text>

  <!-- customer & app -->
  <circle cx="80" cy="35" r="20" fill="#fff" stroke="#33475b" stroke-width="1.3"/>
  <text x="108" y="39" class="tb" style="font-size:12px">Customer</text>
  <rect x="10" y="100" width="140" height="62" rx="6" class="box"/>
  <text x="80" y="122" class="t tb">Mobile app / web</text>
  <text x="80" y="138" class="t sm">+ Zingly chat SDK</text>
  <text x="80" y="152" class="t sm">(client-side PAN masking)</text>

  <!-- control plane -->
  <rect x="260" y="8" width="300" height="44" rx="6" class="box" style="fill:#f3f4f6;stroke-dasharray:4 3"/>
  <text x="410" y="26" class="t tb">Zingly control plane (SaaS)</text>
  <text x="410" y="42" class="t sm">flows, configuration, aggregate metrics — no customer data</text>

  <!-- data plane components -->
  <rect x="210" y="140" width="165" height="46" rx="6" class="box"/>
  <text x="292" y="159" class="t tb">Conversation orchestrator</text>
  <text x="292" y="175" class="t sm">state machines + policy engine</text>
  <rect x="395" y="140" width="165" height="46" rx="6" class="box"/>
  <text x="477" y="159" class="t tb">Guardrails + LLM gateway</text>
  <text x="477" y="175" class="t sm">redaction, grounding, output filter</text>
  <rect x="235" y="213" width="110" height="122" rx="6" class="box"/>
  <text x="290" y="240" class="t tb">Dispute service</text>
  <text x="290" y="257" class="t sm">saga + outbox</text>
  <text x="290" y="271" class="t sm">encrypted store</text>
  <rect x="395" y="215" width="165" height="46" rx="6" class="box"/>
  <text x="477" y="234" class="t tb">Agent handoff adapter</text>
  <text x="477" y="250" class="t sm">context package, platform-neutral</text>
  <text x="477" y="285" class="t sm" style="font-style:italic">account data: in memory only, no copy at rest</text>

  <!-- model endpoint -->
  <rect x="600" y="140" width="185" height="46" rx="6" class="box"/>
  <text x="692" y="159" class="t tb">EU model endpoint</text>
  <text x="692" y="175" class="t sm">Meridian-contracted · no retention</text>

  <!-- right column external -->
  <rect x="815" y="190" width="175" height="62" rx="6" class="box" style="stroke-dasharray:5 3"/>
  <text x="902" y="210" class="t tb">Agent desktop &amp; routing</text>
  <text x="902" y="226" class="t sm">platform to be confirmed</text>
  <text x="902" y="240" class="t sm">(assumption A5)</text>
  <rect x="830" y="289" width="145" height="26" rx="5" class="box"/>
  <text x="902" y="306" class="t tb">Case (card dispute)</text>
  <rect x="830" y="322" width="145" height="26" rx="5" class="box"/>
  <text x="902" y="339" class="t tb">Platform Events</text>

  <!-- bank systems -->
  <rect x="190" y="405" width="115" height="52" rx="6" class="box"/>
  <text x="247" y="426" class="t tb">Bank IdP</text>
  <text x="247" y="442" class="t sm">OAuth / OIDC · SCA</text>
  <rect x="315" y="405" width="150" height="52" rx="6" class="box" style="stroke:#2d8a57;stroke-width:2"/>
  <text x="390" y="426" class="t tb">Assistant API façade</text>
  <text x="390" y="442" class="t sm">REST · DMZ · entitlements</text>
  <path d="M480,410 a45,6 0 0 0 90,0 a45,6 0 0 0 -90,0 v40 a45,6 0 0 0 90,0 v-40" fill="#fff" stroke="#33475b" stroke-width="1.3"/>
  <text x="525" y="432" class="t tb">Core banking</text>
  <text x="525" y="447" class="t sm">SOAP</text>
  <rect x="582" y="405" width="100" height="52" rx="6" class="box"/>
  <text x="632" y="426" class="t tb">Push service</text>
  <text x="632" y="442" class="t sm">→ customer device</text>
  <rect x="692" y="405" width="100" height="52" rx="6" class="box"/>
  <text x="742" y="426" class="t tb">SIEM</text>
  <text x="742" y="442" class="t sm">audit archive</text>

  <!-- arrows -->
  <path class="ln" d="M80,55 V98"/>
  <path class="ln" d="M80,162 V431 H188"/>
  <text x="88" y="300" class="lbl">login + token exchange</text>
  <path class="ln" d="M150,152 H208"/>
  <text x="166" y="145" class="lbl">chat</text>
  <path class="ln" d="M375,163 H393"/>
  <path class="ln" d="M560,163 H598"/>
  
  <path class="ln" d="M290,186 V211"/>
  <path class="ln" d="M365,186 V238 H393"/>
  <path class="ln" d="M560,238 H813"/>
  <text x="690" y="232" class="lbl" text-anchor="middle">handoff + context</text>
  <path class="ln" d="M345,302 H828"/>
  <text x="690" y="296" class="lbl" text-anchor="middle">upsert Case (idempotent)</text>
  <path class="ln" d="M830,335 H347"/>
  <text x="690" y="330" class="lbl" text-anchor="middle">status events (Pub/Sub API)</text>
  <path class="ln" d="M330,350 V403" style="stroke-width:2.2"/>
  <text x="338" y="382" class="lbl">mTLS + delegated JWT</text>
  <path class="ln" d="M465,431 H478"/>
  <path class="ln" d="M530,350 V388 H632 V403"/>
  <text x="560" y="383" class="lbl">notify</text>
  <path class="ln" d="M560,350 V370 H742 V403" style="stroke-dasharray:5 3"/>
  <text x="700" y="366" class="lbl" text-anchor="middle">audit stream</text>
  <path class="ln" d="M410,52 V98" style="stroke-dasharray:4 3"/>
  <text x="418" y="66" class="lbl">config only</text>
</svg>
